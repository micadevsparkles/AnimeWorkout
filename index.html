<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Testador de Sprite Sheet</title>
    <style>
        body {
            background-color: #0f0a14; /* Fundo escuro para contrastar o cristal */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: white;
            flex-direction: column;
        }

        h2 { margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        /* A MÁGICA ACONTECE AQUI */
        .janela-cristal {
            width: 256px;   /* Largura exata de um único frame */
            height: 256px;  /* Altura exata de um único frame */
            
            /* SUBSTITUA PELO NOME DO SEU ARQUIVO SE FOR DIFERENTE: */
            background-image: url('cristal_player.png'); 
            
            background-repeat: no-repeat;
            background-position: 0px 0px;
            
            /* Aplica a animação: dura 0.8s, tem 8 passos exatos e roda para sempre */
            animation: girar 0.8s steps(8) infinite;
            
            image-rendering: pixelated; /* Mantém as bordas nítidas na web */
        }

        /* Move a folha inteira para a esquerda, frame por frame */
        @keyframes girar {
            from { background-position: 0px 0px; }
            to { background-position: -2048px 0px; } /* 256px * 8 frames */
        }
    </style>
</head>
<body>

    <h2>Visualização do Cristal Mágico</h2>
    <div class="janela-cristal"></div>

</body>
</html>
